[package]
name = "bikepackid_auth_service"
version = "0.1.0"
edition = "2021"

# User/session/auth service — Journey/Checkpoint/Post moved out to
# journey-service (see ../journey-service), so R2/moka/rusty-s3/url and
# the OTel/JWT/error/audit infrastructure (now in ../common) are no
# longer direct dependencies here. Renamed from `backend` once it was no
# longer "the" backend, just one of two services.
[dependencies]
bikepackid_common = { path = "../common" }
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate", "derive", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
dotenvy = "0.15"
oauth2 = { version = "5", features = ["reqwest"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
tracing = "0.1"
tower_governor = { version = "0.3.0", features = ["tracing"] }
percent-encoding = "2.3.2"
# aws-sdk-sesv2's *own* default feature set bundles two unrelated things
# both named confusingly: "default-https-client" is the modern
# hyper-1/rustls-0.23 stack (keep it), but its separate "rustls" feature
# is specifically the flag that turns on aws-smithy-runtime's legacy
# hyper-0.14/rustls-0.21 connector (`connector-hyper-0-14-x`) — a
# backward-compat path, not an alternative TLS backend for the modern
# client. Verified via `cargo tree -e features -i aws-smithy-http-client`:
# with "rustls" enabled, both stacks end up in the tree simultaneously,
# and `cargo audit` flags real RUSTSEC advisories against the old
# h2/rustls-webpki that drags in. Dropping just "rustls" (not
# "default-https-client") removes the legacy connector entirely; nothing
# else in the tree re-enables it. Also drops "sigv4a" (multi-region
# SigV4A signing — SES doesn't need it) since trimming features means
# picking them explicitly rather than keeping the full default set.
aws-sdk-sesv2 = { version = "1.140.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-config = "1.12.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
