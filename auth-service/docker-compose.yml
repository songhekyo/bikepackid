# Pinned explicitly to the name Compose has *always* defaulted to here
# (this file never set `name:` before, so Compose derived it from the
# directory, which was `backend` until this PR). Directory renamed to
# `auth-service`, but the project name must NOT follow it: an instance
# that's already live has an existing `backend_postgres_data` volume
# (self-hosted Postgres, docker-compose.postgres.yml) tied to that name.
# Without this pin, the next `docker compose up -d` after the directory
# rename would default to project name `auth-service`, look for
# `auth-service_postgres_data` instead, not find it, and silently create
# a brand new empty one — orphaning production data rather than erroring.
name: backend

services:
  auth-service:
    # Built by .github/workflows/ci.yml on every push to main and pushed to
    # GHCR — the server only ever pulls a prebuilt image, it never compiles
    # Rust itself (see DEPLOY.md/DEPLOY_AWS.md for why: neither the old
    # 1 vCPU/1GB VPS nor cheap EC2 instance types are a reasonable place to
    # run a Rust compile repeatedly). Renamed from `bikepackid-backend` —
    # see DEPLOY_AWS.md's "Renaming backend to auth-service" section for
    # the one-time server-side cutover this requires.
    image: ghcr.io/songhekyo/bikepackid-auth-service:latest
    restart: unless-stopped
    env_file:
      - .env
    # Published directly to the host so nginx (running on the host, see
    # DEPLOY_AWS.md) can reverse-proxy to 127.0.0.1:8080. Keep this closed off
    # from the outside in the firewall once nginx is the only public entry
    # point — auth-service should be reached through the reverse proxy, not
    # directly from the internet.
    ports:
      - "8080:8080"
    # Opts this container in to Watchtower below (WATCHTOWER_LABEL_ENABLE
    # scopes it to only labeled containers) — alloy is deliberately left
    # unlabeled, see the comment on the watchtower service for why.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Journey/Checkpoint/Post split out of `auth-service` (formerly
  # `backend`) into its own deployable service (see
  # docs/AWS_MIGRATION.md Fase 2) — shares the same Postgres and `.env`
  # as auth-service (DATABASE_URL, JWT_SECRET, FRONTEND_URL, R2_*,
  # OTEL_EXPORTER_OTLP_ENDPOINT are all already there since auth-service
  # needs the same values), only `PORT` differs.
  journey-service:
    image: ghcr.io/songhekyo/bikepackid-journey-service:latest
    restart: unless-stopped
    env_file:
      - .env
    # Overrides the `.env` file's PORT=8080 (auth-service's own) —
    # env_file values are the container's defaults, and a service's own
    # `environment` takes precedence over them for the same key.
    environment:
      PORT: "8081"
    # Same reasoning as auth-service's port mapping above — published so
    # nginx can reverse-proxy specific paths (/journeys, /checkpoints,
    # /uploads/presign-url, /me/journeys) here instead of to
    # auth-service:8080. Nginx itself isn't tracked in this repo (see
    # DEPLOY_AWS.md) — adding that routing is a manual step on the server
    # once this is deployed.
    ports:
      - "8081:8081"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Local OTLP collector: receives traces from auth-service and
  # journey-service and forwards them to Grafana Cloud with the account
  # credentials, so neither service itself needs to know them (they only
  # ever talk to this container over the Docker-internal network,
  # unauthenticated). Not exposed to the host or the internet — only
  # containers on this compose network can reach it, via service name.
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./deploy/config.alloy:/etc/alloy/config.alloy:z
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}

  # Polls GHCR every 5 minutes for a new image digest on any labeled
  # service (`auth-service`, `journey-service`) and, when it finds one,
  # pulls it and recreates that container automatically — this is what
  # makes "merge to main" actually mean "live" without connecting in for
  # a manual `docker compose pull && up -d` every time (see
  # DEPLOY_AWS.md).
  # Scoped to WATCHTOWER_LABEL_ENABLE + each service's own label on
  # purpose: `alloy` tracks `grafana/alloy:latest` too, but we don't want it
  # silently auto-upgrading — Alloy's config syntax has already broken once
  # this project across versions (see docs/INFRA_HISTORY.md), so that
  # upgrade should stay a deliberate, reviewed step, not an automatic one.
  #
  # Needs /var/run/docker.sock mounted to control other containers, which
  # is effectively root-equivalent access to the host — the accepted
  # tradeoff for a Docker-based auto-updater. Not a concern this compose
  # file introduces lightly: no other service gets that mount.
  #
  # Image is nickfedor/watchtower, not containrrr/watchtower: the original
  # containrrr project is archived/unmaintained, and its last-published
  # image bundles a Docker client too old to talk to modern Docker Engine
  # ("client version 1.25 is too old" against Docker 29.x) — nickfedor's
  # fork is the actively maintained successor.
  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
