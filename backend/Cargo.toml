[package]
name = "bikepackid_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate", "derive", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
dotenvy = "0.15"
oauth2 = { version = "5", features = ["reqwest"] }
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = "0.32.0"
tracing-opentelemetry = "0.33.0"
tower_governor = { version = "0.3.0", features = ["tracing"] }
percent-encoding = "2.3.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
