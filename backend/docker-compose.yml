services:
  backend:
    # Built by .github/workflows/ci.yml on every push to main and pushed to
    # GHCR — the server only ever pulls a prebuilt image, it never compiles
    # Rust itself (see DEPLOY.md/DEPLOY_AWS.md for why: neither the old
    # 1 vCPU/1GB VPS nor cheap EC2 instance types are a reasonable place to
    # run a Rust compile repeatedly).
    image: ghcr.io/songhekyo/bikepackid-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    # Published directly to the host so nginx (running on the host, see
    # DEPLOY_AWS.md) can reverse-proxy to 127.0.0.1:8080. Keep this closed off
    # from the outside in the firewall once nginx is the only public entry
    # point — the backend should be reached through the reverse proxy, not
    # directly from the internet.
    ports:
      - "8080:8080"
    # Opts this container in to Watchtower below (WATCHTOWER_LABEL_ENABLE
    # scopes it to only labeled containers) — alloy is deliberately left
    # unlabeled, see the comment on the watchtower service for why.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Local OTLP collector: receives traces from the backend and forwards
  # them to Grafana Cloud with the account credentials, so the backend
  # itself never needs to know them (it only ever talks to this container
  # over the Docker-internal network, unauthenticated). Not exposed to the
  # host or the internet — only `backend` can reach it, via service name.
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./deploy/config.alloy:/etc/alloy/config.alloy:z
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}

  # Polls GHCR every 5 minutes for a new `backend` image digest and, when it
  # finds one, pulls it and recreates the container automatically — this is
  # what makes "merge to main" actually mean "live" without connecting in
  # for a manual `docker compose pull && up -d` every time (see
  # DEPLOY_AWS.md).
  # Scoped to WATCHTOWER_LABEL_ENABLE + the label on `backend` above on
  # purpose: `alloy` tracks `grafana/alloy:latest` too, but we don't want it
  # silently auto-upgrading — Alloy's config syntax has already broken once
  # this project across versions (see docs/INFRA_HISTORY.md), so that
  # upgrade should stay a deliberate, reviewed step, not an automatic one.
  #
  # Needs /var/run/docker.sock mounted to control other containers, which
  # is effectively root-equivalent access to the host — the accepted
  # tradeoff for a Docker-based auto-updater. Not a concern this compose
  # file introduces lightly: no other service gets that mount.
  #
  # Image is nickfedor/watchtower, not containrrr/watchtower: the original
  # containrrr project is archived/unmaintained, and its last-published
  # image bundles a Docker client too old to talk to modern Docker Engine
  # ("client version 1.25 is too old" against Docker 29.x) — nickfedor's
  # fork is the actively maintained successor.
  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
