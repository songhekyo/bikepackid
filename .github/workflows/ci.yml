name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # None of these are real credentials — tests build an AppState/router
      # via `test_support::app_state()` and drive it with `oneshot`, they
      # never make a real outbound call to Google. `Config::from_env()` just
      # needs these present (and GOOGLE_REDIRECT_URL parseable as a URL) or
      # it panics before any test body runs.
      JWT_SECRET: ci-test-secret
      GOOGLE_CLIENT_ID: ci-test-client-id
      GOOGLE_CLIENT_SECRET: ci-test-client-secret
      GOOGLE_REDIRECT_URL: http://localhost:8080/auth/google/callback
      FRONTEND_URL: http://localhost:3000
      # Also not real — tests only compute R2 presigned-URL signatures
      # locally (pure math, no network call to R2), never actually hit
      # Cloudflare. See journey::storage::tests.
      R2_ACCOUNT_ID: ci-test-account
      R2_ACCESS_KEY_ID: ci-test-key
      R2_SECRET_ACCESS_KEY: ci-test-secret
      R2_BUCKET_NAME: ci-test-bucket
      R2_PUBLIC_URL_BASE: https://pub-ci-test.r2.dev
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Apply migrations
        run: for f in migrations/*.sql; do psql "$DATABASE_URL" -f "$f"; done

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

  # Built per-arch on a native runner each (not one job cross-building both
  # via QEMU) — emulated Rust compilation is dramatically slower than native
  # since compilers are syscall/thread-heavy, the worst case for emulation
  # overhead. `ubuntu-24.04-arm` is a real ARM64 GitHub-hosted runner.
  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/songhekyo/bikepackid-backend:sha-${{ github.sha }}-${{ matrix.suffix }}

  # Combines the two single-arch images built above into one multi-arch
  # manifest — this is metadata-only (no rebuild), so it's fast regardless
  # of how long the arch-specific builds above took.
  merge-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/songhekyo/bikepackid-backend:latest \
            -t ghcr.io/songhekyo/bikepackid-backend:sha-${{ github.sha }} \
            ghcr.io/songhekyo/bikepackid-backend:sha-${{ github.sha }}-amd64 \
            ghcr.io/songhekyo/bikepackid-backend:sha-${{ github.sha }}-arm64
