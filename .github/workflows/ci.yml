name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # None of these are real credentials — tests build an AppState/router
      # via `test_support::app_state()` and drive it with `oneshot`, they
      # never make a real outbound call to Google. `Config::from_env()` just
      # needs these present (and GOOGLE_REDIRECT_URL parseable as a URL) or
      # it panics before any test body runs.
      JWT_SECRET: ci-test-secret
      GOOGLE_CLIENT_ID: ci-test-client-id
      GOOGLE_CLIENT_SECRET: ci-test-client-secret
      GOOGLE_REDIRECT_URL: http://localhost:8080/auth/google/callback
      FRONTEND_URL: http://localhost:3000
      # Also not real — tests only compute R2 presigned-URL signatures
      # locally (pure math, no network call to R2), never actually hit
      # Cloudflare. See journey::storage::tests.
      R2_ACCOUNT_ID: ci-test-account
      R2_ACCESS_KEY_ID: ci-test-key
      R2_SECRET_ACCESS_KEY: ci-test-secret
      R2_BUCKET_NAME: ci-test-bucket
      R2_PUBLIC_URL_BASE: https://pub-ci-test.r2.dev
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # "." (repo root), not "auth-service" — Cargo.toml at the repo
          # root makes it the actual workspace root (auth-service, common
          # and journey-service members) since the monorepo restructuring.
          workspaces: .

      - name: Apply migrations
        run: for f in auth-service/migrations/*.sql; do psql "$DATABASE_URL" -f "$f"; done

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

  # Decides which service images actually need rebuilding for this push —
  # without this, both build-and-push jobs ran unconditionally on every
  # push to main, including commits that only touched web/index.html or
  # docs. That meant Watchtower on EC2 saw a "new" image (new SHA tag,
  # identical layers underneath) and restarted both containers for no
  # code reason — a real, avoidable blip on every unrelated change.
  # Doesn't `need: test` — this is cheap and independent, so it runs in
  # parallel with the test job instead of waiting on it.
  changes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      auth-service: ${{ steps.filter.outputs.auth-service }}
      journey-service: ${{ steps.filter.outputs.journey-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Cargo.lock/Cargo.toml at the repo root are the shared
          # workspace manifest/lockfile — a dependency bump there can
          # change either service's build even without touching its own
          # directory, so both filters include them. `common/` is a path
          # dependency of both services for the same reason.
          filters: |
            auth-service:
              - 'auth-service/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            journey-service:
              - 'journey-service/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  # arm64-only, on a native ARM64 GitHub-hosted runner — amd64 was needed
  # while the Nusa VPS (x86) was still live; now that it's decommissioned
  # (production is the AWS EC2 Graviton instance), arm64 is the only
  # deployment target. Native runner (not QEMU) since emulated Rust
  # compilation is dramatically slower — compilers are syscall/thread-heavy,
  # the worst case for emulation overhead.
  # Renamed from `build-and-push` (and the crate/directory from `backend`)
  # once it was no longer "the" backend, just the auth/user/session
  # service — see auth-service/DEPLOY_AWS.md for the server-side image
  # rename this required.
  build-and-push-auth-service:
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.auth-service == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          # Repo root, not auth-service/ — the Dockerfile now needs to see
          # the sibling `common` crate too (auth-service depends on it via
          # a path dependency since the monorepo restructuring).
          context: .
          file: auth-service/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/songhekyo/bikepackid-auth-service:latest
            ghcr.io/songhekyo/bikepackid-auth-service:sha-${{ github.sha }}

  # Builds and publishes the journey-service image alongside
  # auth-service's. Publishing here only makes the image pullable —
  # nothing deploys it: docker-compose.yml/nginx/the EC2 instance are
  # untouched by this repo until a deliberate follow-up wires it in.
  build-and-push-journey-service:
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.journey-service == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: journey-service/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/songhekyo/bikepackid-journey-service:latest
            ghcr.io/songhekyo/bikepackid-journey-service:sha-${{ github.sha }}
